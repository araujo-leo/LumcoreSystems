<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{subject}}</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background: #f9f9f9; }
        .header { background: #007bff; color: white; text-align: center; padding: 10px; font-size: 20px; border-radius: 5px 5px 0 0; }
        .content { padding: 20px; }
        .footer { text-align: center; font-size: 12px; color: #777; margin-top: 20px; }
        hr{ background-color: #777;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">{{header}}</div>
        <div class="content">
            <p>Olá, <strong>{{name}}</strong>!</p>
            <p>{{message}}</p>
        </div>
        <div class="footer">
            <p>Atenciosamente, <br> Equipe {{company}}</p>
            {{unsubscribe_button}}
        </div>

        
    </div>
</body>
</html>
